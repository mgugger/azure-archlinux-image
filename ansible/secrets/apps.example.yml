---
# Copy to apps.local.yml (gitignored), or pass an Ansible Vault vars file with -e @file.
# Recover the original values when restoring existing application data.
immich_db_password: ""
papra_auth_secret: ""
papra_document_encryption_keys: ""
# Paste the complete existing rclone.conf, including the OneDrive token and crypt
# keys. Only seeds a missing file, preserving subsequent OAuth token refreshes.
rclone_onedrive_config_content: ""

# NetBird: generate three independent values with openssl rand -base64 32.
# Preserve the encryption keys when restoring the NetBird databases.
netbird_relay_auth_secret: ""
netbird_store_encryption_key: ""
netbird_session_cookie_encryption_key: ""

# Alternatively, set these three keys directly in /etc/netbird-server/secrets.yml.
# NetBird manages its own persistent/live STUN firewall rule.
