---
- name: Check for server-local NetBird secrets
  ansible.builtin.stat:
    path: "{{ netbird_secrets_file }}"
  register: netbird_server_secrets_stat

- name: Read server-local NetBird secrets
  ansible.builtin.slurp:
    src: "{{ netbird_secrets_file }}"
  register: netbird_server_secrets_content
  when: netbird_server_secrets_stat.stat.exists
  no_log: true

- name: Parse server-local NetBird secrets
  ansible.builtin.set_fact:
    netbird_server_secrets: "{{ netbird_server_secrets_content.content | b64decode | from_yaml }}"
  when: netbird_server_secrets_stat.stat.exists
  no_log: true

- name: Require server-local secrets to be a YAML mapping
  ansible.builtin.assert:
    that:
      - netbird_server_secrets is mapping
    fail_msg: "The server-local NetBird secrets file must contain a YAML mapping."
  when: netbird_server_secrets_stat.stat.exists

- name: Use server-local secrets when not supplied by Ansible
  ansible.builtin.set_fact:
    netbird_relay_auth_secret: "{{ netbird_relay_auth_secret if netbird_relay_auth_secret | length > 0 else (netbird_server_secrets | default({})).get('netbird_relay_auth_secret', '') }}"
    netbird_store_encryption_key: "{{ netbird_store_encryption_key if netbird_store_encryption_key | length > 0 else (netbird_server_secrets | default({})).get('netbird_store_encryption_key', '') }}"
    netbird_session_cookie_encryption_key: "{{ netbird_session_cookie_encryption_key if netbird_session_cookie_encryption_key | length > 0 else (netbird_server_secrets | default({})).get('netbird_session_cookie_encryption_key', '') }}"
  no_log: true

- name: Encode raw 32-byte encryption keys for the server configuration
  ansible.builtin.set_fact:
    netbird_store_encryption_key: "{{ (netbird_store_encryption_key | b64encode) if netbird_store_encryption_key | length == 32 else netbird_store_encryption_key }}"
    netbird_session_cookie_encryption_key: "{{ (netbird_session_cookie_encryption_key | b64encode) if netbird_session_cookie_encryption_key | length == 32 else netbird_session_cookie_encryption_key }}"
  no_log: true

- name: Validate readiness of all NetBird secrets
  ansible.builtin.set_fact:
    netbird_secrets_ready: >-
      {{ netbird_relay_auth_secret | length >= 32 and
         netbird_store_encryption_key | length == 44 and
         netbird_store_encryption_key is match('^[A-Za-z0-9+/]{43}=$') and
         netbird_session_cookie_encryption_key | length == 44 and
         netbird_session_cookie_encryption_key is match('^[A-Za-z0-9+/]{43}=$') }}
  no_log: true
