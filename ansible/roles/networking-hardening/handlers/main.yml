---
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload nftables
  ansible.builtin.command:
    argv: [/usr/bin/nft, --file, /etc/nftables.conf]
  changed_when: true

- name: Restart tinyproxy
  ansible.builtin.systemd:
    name: tinyproxy
    state: restarted
