---
# Entry point for ansible-pull.
# Usage:  ansible-pull -U <repo-url> ansible/local.yml
#
# Roles applied here are idempotent; safe to re-run on every boot via
# cloud-init or a systemd timer.

- name: All roles
  hosts: all
  connection: ssh
  become: true
  pre_tasks:
    - name: Load local application secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets/apps.local.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir + '/secrets/apps.local.yml') | length > 0
      tags: always

    - name: Load local grafana alloy secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/secrets/grafana-alloy.local.yml"
      when: lookup('ansible.builtin.fileglob', playbook_dir + '/secrets/grafana-alloy.local.yml') | length > 0

  roles:
    - networking-hardening
    #- snapper
    #- restic
    #- caddy
    #- vaultwarden
    # - grafana-alloy
    #- jellyfin
    #- pacman-auto-update
    #- yay-bin
    - { role: trilium-next-server, tags: [trilium-next-server] }
    #- { role: rclone-onedrive, tags: [apps, rclone-onedrive] }
    #- { role: immich, tags: [apps, immich] }
    #- { role: papra, tags: [apps, papra] }
    - { role: netbird, tags: [apps, netbird] }
    - { role: netbird-client, tags: [apps, netbird-client] }
    - { role: bifrost, tags: [apps, bifrost] }
    - { role: open-webui, tags: [apps, open-webui] }
